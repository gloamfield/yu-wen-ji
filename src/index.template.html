<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4eee9">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="余温机 · 一部会自己继续生活的 AI 小手机">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>余温机</title>
  <style>
/*__STYLES__*/
  </style>
</head>
<body>
  <div id="stage">
    <div id="phone">
      <div id="screen"></div>
      <div id="statusbar">
        <div class="status-left">
          <span id="status-time">9:41</span>
        </div>
        <div class="status-right">
          <button class="status-btn" data-action="notifications" aria-label="通知" title="通知">
            <span id="status-bell"></span>
            <span id="status-badge" class="status-badge" hidden>0</span>
          </button>
          <span class="signal">▂▄▆</span>
          <span class="wifi">⌁</span>
          <span class="battery"><i></i></span>
        </div>
      </div>
      <div id="home-indicator"></div>
      <div id="lock-screen"></div>
      <div id="notification-drawer"></div>
      <div id="modal-root"></div>
      <div id="toast-root"></div>
    </div>
  </div>
  <script>
/*__SCRIPTS__*/
  </script>
</body>
</html>
